name: LytHouse Quality Gate
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lint (legacy debt report)
        continue-on-error: true
        run: npm run lint
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime env files
        shell: bash
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Runtime environment files must not be committed:"
            echo "$tracked"
            exit 1
          fi
