name: Lythouse Analysis Worker Scheduler

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lythouse-analysis-worker-scheduler
  cancel-in-progress: false

env:
  SUPABASE_URL: https://kqjyubxrbjyvakpvcymc.supabase.co

jobs:
  wake-ready-analysis-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate scheduler configuration
        env:
          LYTHOUSE_WORKER_SECRET: ${{ secrets.LYTHOUSE_WORKER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$LYTHOUSE_WORKER_SECRET" || { echo 'BLOCKED: LYTHOUSE_WORKER_SECRET GitHub Actions secret is required'; exit 1; }
          test "$SUPABASE_URL" = 'https://kqjyubxrbjyvakpvcymc.supabase.co' || { echo 'Refusing to wake jobs on an unexpected backend'; exit 1; }

      - name: Wake analysis jobs whose retry delay has elapsed
        env:
          LYTHOUSE_WORKER_SECRET: ${{ secrets.LYTHOUSE_WORKER_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 45 \
            -X POST "$SUPABASE_URL/functions/v1/analysis-worker-scheduler" \
            -H 'Content-Type: application/json' \
            -H "x-lythouse-worker-secret: $LYTHOUSE_WORKER_SECRET" \
            -d '{}')
          echo "$response"
