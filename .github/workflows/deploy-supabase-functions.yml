name: Deploy Lythouse Analysis Backend

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lythouse-supabase-production
  cancel-in-progress: false

jobs:
  deploy-analysis-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production deployment configuration
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN secret is required'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'SUPABASE_PROJECT_REF secret is required'; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Run Analysis control-plane functions
        run: |
          set -euo pipefail
          functions=(
            repository-snapshot
            process-validation
            analysis-orchestrator
            analysis-status
            analysis-worker
            analysis-worker-scheduler
            analysis-worker-health
            application-model-builder
            application-model-coverage
            deployment-topology-analyzer
            analysis-ai-review-worker
            ai-validation-review
            cross-domain-reasoner
            architecture-impact-analyzer
            evidence-verifier
            rebuild-intelligence
          )
          for fn in "${functions[@]}"; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Production backend deployment summary
        run: |
          echo 'Run Analysis backend deployment completed.'
          echo "Project ref: $SUPABASE_PROJECT_REF"
          echo "Commit: $GITHUB_SHA"
