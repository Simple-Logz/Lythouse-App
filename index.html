<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LytHouse - Pre-Deployment Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <style>
      /* Mobile auth/trial: readable, balanced and comfortably spaced. */
      @media (max-width: 900px) {
        .ft-right,.au-right{padding:17px 20px 20px!important;min-height:100svh;overflow-y:auto!important}
        .ft-form,.au-form{width:100%!important;max-width:414px!important;margin:9px auto 0!important}
        /* Billing is required: remove the old no-credit-card claim. */
        .ft-form>div:first-child>p,.ft-form>div.mb-1>p{display:none!important}
        .ft-form h2,.au-form h2{font-size:1.5rem!important;line-height:1.18!important}
        .ft-soc{gap:10px!important;margin-top:15px!important}
        .ft-sbtn{height:45px!important;font-size:14.5px!important;border-radius:10px!important;margin-bottom:2px!important}
        .ft-sbtn .ico{left:15px!important;transform:scale(1)}
        .ft-div{margin:16px 0 4px!important;font-size:11.75px!important}
        .ft-row2{gap:10px!important}
        .ft-form .mt-3{margin-top:.6rem!important}
        .ft-form .mt-4{margin-top:.75rem!important}
        .ft-form .label,.au-form .label{font-size:13.25px!important;margin-bottom:4px!important}
        .ft-form .input,.au-form .input{padding:.62rem .82rem!important;font-size:13.75px!important;line-height:1.2!important;border-radius:10px!important;min-height:44px!important}
        .ft-form select.input{height:44px!important}
        .ft-form p.text-xs{font-size:10.75px!important;line-height:1.25!important;margin-top:4px!important}
        .ft-form button[type="submit"]{padding-top:.7rem!important;padding-bottom:.7rem!important;font-size:13.75px!important;margin-top:2px!important}
        .au-form .mb-6{margin-bottom:1rem!important}
        .au-form form.space-y-4>:not([hidden])~:not([hidden]){margin-top:.75rem!important}
      }
      @media (max-width: 440px) {
        .ft-row2{grid-template-columns:1fr 1fr!important}
        .ft-right,.au-right{padding-left:16px!important;padding-right:16px!important}
      }
      @media (max-width: 350px) {
        .ft-row2{grid-template-columns:1fr!important}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
