<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LytHouse - Pre-Deployment Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <style>
      /* Mobile auth/trial: comfortably readable while keeping the full form close to one viewport. */
      @media (max-width: 900px) {
        .ft-right,.au-right{padding:16px 20px 18px!important;min-height:100svh;overflow-y:auto!important}
        .ft-form,.au-form{width:100%!important;max-width:404px!important;margin:8px auto 0!important}
        /* Billing is required: remove the old no-credit-card claim. */
        .ft-form>div:first-child>p,.ft-form>div.mb-1>p{display:none!important}
        .ft-form h2,.au-form h2{font-size:1.45rem!important;line-height:1.18!important}
        .ft-soc{gap:7px!important;margin-top:13px!important}
        .ft-sbtn{height:42px!important;font-size:14px!important;border-radius:9px!important}
        .ft-sbtn .ico{left:14px!important;transform:scale(.96)}
        .ft-div{margin:14px 0 3px!important;font-size:11.5px!important}
        .ft-row2{gap:9px!important}
        .ft-form .mt-3{margin-top:.55rem!important}
        .ft-form .mt-4{margin-top:.7rem!important}
        .ft-form .label,.au-form .label{font-size:13px!important;margin-bottom:4px!important}
        .ft-form .input,.au-form .input{padding:.58rem .8rem!important;font-size:13.5px!important;line-height:1.2!important;border-radius:10px!important;min-height:42px!important}
        .ft-form select.input{height:42px!important}
        .ft-form p.text-xs{font-size:10.5px!important;line-height:1.25!important;margin-top:4px!important}
        .ft-form button[type="submit"]{padding-top:.65rem!important;padding-bottom:.65rem!important;font-size:13.5px!important}
        .au-form .mb-6{margin-bottom:1rem!important}
        .au-form form.space-y-4>:not([hidden])~:not([hidden]){margin-top:.7rem!important}
      }
      @media (max-width: 440px) {
        .ft-row2{grid-template-columns:1fr 1fr!important}
        .ft-right,.au-right{padding-left:16px!important;padding-right:16px!important}
      }
      @media (max-width: 350px) {
        .ft-row2{grid-template-columns:1fr!important}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
