<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LytHouse - Pre-Deployment Intelligence</title>
    <!-- Loaded as a real <link>, not a CSS @import, so the fonts fetch in
         parallel with everything else instead of blocking the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <style>
      /* Compact public auth/trial screens so the complete form is visible on phones. */
      @media (max-width: 900px) {
        .ft-right,.au-right{padding:10px 18px 12px!important;min-height:100svh;overflow-y:auto!important}
        .ft-form,.au-form{max-width:370px!important;margin:4px auto 0!important}
        /* The trial requires billing, so never show the old no-credit-card claim. */
        .ft-form>div:first-child>p,.ft-form>div.mb-1>p{display:none!important}
        .ft-form h2,.au-form h2{font-size:1.18rem!important;line-height:1.15!important}
        .ft-soc{gap:5px!important;margin-top:8px!important}
        .ft-sbtn{height:34px!important;font-size:12px!important;border-radius:8px!important}
        .ft-sbtn .ico{left:12px!important;transform:scale(.88)}
        .ft-div{margin:9px 0 1px!important;font-size:10.5px!important}
        .ft-row2{gap:7px!important}
        .ft-form .mt-3{margin-top:.38rem!important}
        .ft-form .mt-4{margin-top:.5rem!important}
        .ft-form .label,.au-form .label{font-size:11.5px!important;margin-bottom:2px!important}
        .ft-form .input,.au-form .input{padding:.4rem .7rem!important;font-size:12px!important;line-height:1.15!important;border-radius:9px!important;min-height:34px!important}
        .ft-form select.input{height:34px!important}
        .ft-form p.text-xs{font-size:9.5px!important;line-height:1.2!important;margin-top:3px!important}
        .ft-form button[type="submit"]{padding-top:.48rem!important;padding-bottom:.48rem!important;font-size:12px!important}
        .au-form .mb-6{margin-bottom:.75rem!important}
        .au-form form.space-y-4>:not([hidden])~:not([hidden]){margin-top:.5rem!important}
      }
      @media (max-width: 440px) {
        .ft-row2{grid-template-columns:1fr 1fr!important}
        .ft-right,.au-right{padding-left:14px!important;padding-right:14px!important}
      }
      @media (max-width: 350px) {
        .ft-row2{grid-template-columns:1fr!important}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
